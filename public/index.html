<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-проверка документов</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .upload-section {
      border: 2px dashed #3498db;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 30px;
      transition: border-color 0.3s;
      background-color: #f8fbff;
    }

    .upload-section:hover {
      border-color: #2980b9;
    }

    .upload-label {
      display: block;
      cursor: pointer;
      color: #3498db;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .upload-input {
      display: none;
    }

    .upload-text {
      color: #7f8c8d;
      font-size: 16px;
    }

    .file-info {
      margin-top: 20px;
      padding: 15px;
      background-color: #e8f4fc;
      border-radius: 5px;
      display: none;
    }

    .progress-container {
      margin: 20px 0;
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #ecf0f1;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: #3498db;
      width: 0%;
      transition: width 0.3s;
    }

    .progress-text {
      text-align: center;
      margin-top: 5px;
      font-size: 14px;
      color: #7f8c8d;
    }

    .btn {
      display: inline-block;
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 10px 5px;
    }

    .btn:hover {
      background-color: #2980b9;
    }

    .btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .btn-check {
      background-color: #2ecc71;
    }

    .btn-check:hover {
      background-color: #27ae60;
    }

    .result-section {
      margin-top: 30px;
      padding: 20px;
      background-color: #f8f9fa;
      border-radius: 5px;
      display: none;
    }

    .result-content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .supported-formats {
      text-align: center;
      color: #7f8c8d;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI-проверка юридических документов</h1>
    
    <div class="upload-section">
      <label for="document-upload" class="upload-label">Выберите файл для загрузки</label>
      <input type="file" id="document-upload" class="upload-input" accept=".doc,.docx,.pdf">
      <p class="upload-text">или перетащите файл сюда</p>
      <p class="supported-formats">Поддерживаемые форматы: DOC, DOCX, PDF (макс. 10 МБ)</p>
    </div>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    
    <div class="file-info" id="fileInfo">
      <p><strong>Выбран файл:</strong> <span id="fileName"></span></p>
      <button class="btn" id="uploadBtn">Загрузить файл</button>
    </div>
    
    <div class="actions" style="text-align: center; display: none;" id="actions">
      <button class="btn btn-check" id="checkBtn" disabled>Запустить проверку</button>
    </div>
    
    <div class="result-section" id="resultSection">
      <h3>Результат проверки:</h3>
      <div class="result-content" id="resultContent"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const uploadInput = document.getElementById('document-upload');
      const fileInfo = document.getElementById('fileInfo');
      const fileName = document.getElementById('fileName');
      const uploadBtn = document.getElementById('uploadBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const actions = document.getElementById('actions');
      const checkBtn = document.getElementById('checkBtn');
      const resultSection = document.getElementById('resultSection');
      const resultContent = document.getElementById('resultContent');
      
      let uploadedFileName = '';
      let documentContent = '';
      
      // Обработка выбора файла
      uploadInput.addEventListener('change', function(e) {
        if (this.files.length > 0) {
          const file = this.files[0];
          fileName.textContent = file.name;
          fileInfo.style.display = 'block';
        }
      });
      
      // Загрузка файла
      uploadBtn.addEventListener('click', function() {
        const file = uploadInput.files[0];
        if (!file) {
          alert('Пожалуйста, выберите файл для загрузки');
          return;
        }
        
        const formData = new FormData();
        formData.append('document', file);
        
        // Показываем прогресс-бар
        progressContainer.style.display = 'block';
        updateProgress(0, 'Загрузка файла...');
        
        // Создаем XMLHttpRequest для отслеживания прогресса
        const xhr = new XMLHttpRequest();
        
        // Отслеживание прогресса отправки
        xhr.upload.addEventListener('progress', function(e) {
          if (e.lengthComputable) {
            const percentComplete = Math.round((e.loaded / e.total) * 100);
            updateProgress(percentComplete, `Загрузка: ${percentComplete}%`);
          }
        });
        
        // Обработка ответа
        xhr.addEventListener('load', function() {
          if (xhr.status === 200) {
            const response = JSON.parse(xhr.responseText);
            if (response.success) {
              updateProgress(100, 'Файл успешно загружен!');
              uploadedFileName = response.filename;
              documentContent = response.content;
              
              // Через 1 секунду скрываем прогресс и показываем кнопку проверки
              setTimeout(() => {
                progressContainer.style.display = 'none';
                actions.style.display = 'block';
                checkBtn.disabled = false;
              }, 1000);
            } else {
              alert('Ошибка при загрузке файла: ' + response.error);
              progressContainer.style.display = 'none';
            }
          } else {
            alert('Ошибка при загрузке файла');
            progressContainer.style.display = 'none';
          }
        });
        
        xhr.addEventListener('error', function() {
          alert('Произошла ошибка при загрузке файла');
          progressContainer.style.display = 'none';
        });
        
        xhr.open('POST', '/upload');
        xhr.send(formData);
      });
      
      // Проверка документа
      checkBtn.addEventListener('click', function() {
        checkBtn.disabled = true;
        checkBtn.textContent = 'Проверяем...';
        
        fetch('/check-document', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            filename: uploadedFileName,
            content: documentContent
          })
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            resultContent.textContent = data.result;
            resultSection.style.display = 'block';
          } else {
            alert('Ошибка при проверке документа: ' + data.error);
          }
          checkBtn.disabled = false;
          checkBtn.textContent = 'Запустить проверку';
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Произошла ошибка при проверке документа');
          checkBtn.disabled = false;
          checkBtn.textContent = 'Запустить проверку';
        });
      });
      
      // Функция обновления прогресса
      function updateProgress(percent, text) {
        progressFill.style.width = percent + '%';
        progressText.textContent = text;
      }
    });
  </script>
</body>
</html>
